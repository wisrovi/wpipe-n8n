services:
  code-server-1:
    image: codercom/code-server:4.16.1-ubuntu
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_USER=$USER
    volumes:
      - ./app:/home/coder/workspace
    ports:
      - 18001:8080
    entrypoint: ["/usr/bin/entrypoint.sh", "--bind-addr", "0.0.0.0:8080", "--auth", "none", "--disable-telemetry", "--disable-workspace-trust", "/home/coder/workspace"]
    restart: unless-stopped

