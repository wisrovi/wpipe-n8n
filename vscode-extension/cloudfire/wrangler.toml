name = "wpipe-license-server"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Environment Variables
[vars]
ENVIRONMENT = "production"
ISSUER = "https://api.wisrovi.dev"
GRACE_PERIOD_DAYS = "7"
LEASE_DURATION_DAYS = "30"

# D1 Serverless SQLite Database Binding
[[d1_databases]]
binding = "DB"
database_name = "wpipe_licenses"
database_id = "wpipe-licenses-db-id"

# R2 Zero-Egress Storage Bucket Binding for Daemon Binaries
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "wpipe-releases"

# Custom Domain Route Configuration (Uncomment when deploying to your Cloudflare zone)
# [routes]
# pattern = "api.wisrovi.dev/*"
# zone_name = "wisrovi.dev"
