version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: wpipe_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wpostgresql
    volumes:
      - ./enviroment/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wpostgresql"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: wpipe_pgadmin4
    restart: unless-stopped
    ports:
      - "1717:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: wisrovi@wisrovi.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wpipe-studio-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - STUDIO_MEDIA_DIR=/app/media
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=wpostgresql
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Persistent host media volume storing SQLite database and isolated user workspaces
      - ./media:/app/media
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wpipe-studio-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Shared host media volume for direct access to user artifacts
      - ./media:/usr/share/nginx/html/media:ro
    restart: unless-stopped

volumes:
  pgadmin-data:
