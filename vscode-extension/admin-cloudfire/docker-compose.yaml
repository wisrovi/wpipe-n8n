services:
  wpipe-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wpipe-admin-dashboard
    image: wisrovi/wpipe-admin-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-e3a420c454b6c6ca891b31aea00ac53f}
      - CLOUDFLARE_D1_DATABASE_ID=${CLOUDFLARE_D1_DATABASE_ID:-44bf0372-587d-446d-84c3-1153c4183b99}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-wisrovi2026}
      - API_BASE_URL=${API_BASE_URL:-https://api.wisrovi.dev}
    restart: unless-stopped
