version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wpipe-studio-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - STUDIO_MEDIA_DIR=/app/media
    volumes:
      # Persistent host media volume storing SQLite database and isolated user workspaces
      - ./media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/auth/users\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wpipe-studio-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Shared host media volume for direct access to user artifacts
      - ./media:/usr/share/nginx/html/media:ro
    restart: unless-stopped
