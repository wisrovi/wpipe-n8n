<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WPipe Studio — Visual Pipeline Canvas & Verified Microservice Generator</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Lienzo visual de orquestación de pipelines WPipe, simulación paso a paso y generador de microservicios con motor local." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="bg-[#07090e] text-gray-100 antialiased font-sans w-full h-full m-0 p-0 overflow-hidden">
    <div id="root" class="w-full h-full min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.debug('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
